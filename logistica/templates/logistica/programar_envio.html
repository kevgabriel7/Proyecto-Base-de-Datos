{% extends 'logistica/base_cliente.html' %}

{% block content %}
<div class="container">
  <h4 class="mb-4">
    <i class="bi bi-send-fill"></i> Programar nuevo envío
  </h4>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Vía de envío</label>
          <select name="id_via" class="form-select" required>
            <option value="">Seleccione una vía</option>
            {% for via in vias %}
            <option value="{{ via.id_via }}">{{ via.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Tipo de servicio</label>
          <select name="id_tipo_servicio" class="form-select" required>
            <option value="">Seleccione servicio</option>
            {% for servicio in servicios %}
            <option value="{{ servicio.id_tipo_servicio }}">{{ servicio.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción del paquete</label>
          <textarea name="descripcion" class="form-control" required></textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <label class="form-label">Largo cm</label>
            <input type="number" step="0.01" name="largo" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Ancho cm</label>
            <input type="number" step="0.01" name="ancho" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Alto cm</label>
            <input type="number" step="0.01" name="alto" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Peso kg</label>
            <input type="number" step="0.001" name="peso_real" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-check-circle"></i> Solicitar envío
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
